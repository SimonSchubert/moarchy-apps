# E402 is enabled on purpose. Every GTK import in this project is preceded by a
# gi.require_version() call, because importing gi.repository.Gtk without one
# takes whichever version is installed -- so module-level imports genuinely
# cannot all sit at the top of the file. Turning the rule on is what makes each
# of those `# noqa: E402` comments a deliberate exception rather than a rule
# nobody had switched on. N is on for the same reason: GObject virtual methods
# are do_activate, not do_Activate, and each one says so.
[lint]
extend-select = ["E402", "N"]

# DTZ wants an explicit timezone on every datetime. This app deliberately has
# none: a note edited at 19:59 says "Edited 19:59" on the phone that edited it,
# and the file stores a Unix timestamp, which has no timezone to lose. Making
# these calls tz-aware would mean either formatting someone's own notes in UTC
# or carrying a timezone database to arrive back where we started.
ignore = ["DTZ001", "DTZ005", "DTZ006"]
