<?xml version="1.0" encoding="UTF-8"?>
<!-- The app drawer shows .desktop icons at 48px on a 360px screen, so this is
     drawn for that size: one shape, one accent, no detail that survives being
     a centimetre across. A bulb because that is what a notes app is, and the
     square is Omarchy's radius rather than a circle, which the drawer's own
     tiles already are. -->
