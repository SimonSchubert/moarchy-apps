<?xml version="1.0" encoding="UTF-8"?>
<!-- A rocket. The silhouette is a triangle, which nothing else in this set
     is: Coins is a disc, Food is a carton, Habits is a grid, and at 42px in
     the drawer the silhouette is the whole of what tells them apart.

     Drawn as an Adwaita object rather than a full bleed tile, which is the
     house pattern here and the reason is in apps/keep/data/org.moarchy.Keep.svg
     at length: the drawer paints the .desktop icon bare, four to a row beside
     Contacts and Calculator, so an icon that fills its own square reads as a
     tile rather than as a thing. The same 88x88 face at x 20..108, y 16..104
     on two 2px lips a step darker down the Adwaita slate ramp, with the 2px
     white specular at 0.187 every icon in this set carries.

     The body is the theme's own light, the flame is the orange a hold wears
     in the list. No clip path anywhere. The drawer renders with QtSvg, which
     ignores clipping and paints the clip shape instead. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect x="20" y="24" width="88" height="88" rx="10" fill="#3d3846"/>
  <rect x="20" y="20" width="88" height="88" rx="10" fill="#5e5c64"/>
  <rect x="20" y="16" width="88" height="88" rx="10" fill="#77767b"/>
  <rect x="22" y="20" width="2" height="80" fill="#ffffff" opacity="0.187"/>
  <polygon points="64,30 78,76 50,76" fill="#f6f5f4"/>
  <polygon points="50,70 44,86 56,76" fill="#f6f5f4"/>
  <polygon points="78,70 84,86 72,76" fill="#f6f5f4"/>
  <circle cx="64" cy="50" r="5" fill="#5e5c64"/>
  <polygon points="56,78 64,100 72,78" fill="#ff7800"/>
  <polygon points="60,78 64,92 68,78" fill="#f5c211"/>
</svg>
