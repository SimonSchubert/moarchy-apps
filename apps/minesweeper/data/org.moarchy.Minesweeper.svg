<?xml version="1.0" encoding="UTF-8"?>
<!-- Drawn as an Adwaita object rather than a full-bleed tile, for the reason
     Keep's icon records: mobileomarchy's AppDrawer.qml paints the .desktop icon
     bare, with no tile behind it, four to a row next to Contacts and
     Calculator. An icon that fills its own square is the one thing in that grid
     that reads as a tile instead of as a thing.

     So this is a field: an 88x88 face at x 20..108, y 16..104 sitting on two 2px
     lips a step darker down a slate ramp (#9a9996, #77767b, #5e5c64), with the
     same 2px white specular at 0.187 inset from the left edge.

     Three cells by three and not eight by eight. A full board at the 42px the
     drawer actually asks for is grey noise; nine cells leave room for one mine,
     one flag and one number, which between them are the whole game and are what
     somebody recognises.

     The numbers are the app's own: a blue 1 and a green 2, which is the classic
     palette and the one the running app derives from the theme's own hues.

     Nothing here is finer than 3px at 128, which is a pixel at 42. No clip
     path: QtSvg ignores clip-path and paints an out-of-defs clipPath as a black
     rectangle, which is how Chess's first icon drew as a black square. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect x="20" y="24" width="88" height="88" rx="10" fill="#5e5c64"/>
  <rect x="20" y="20" width="88" height="88" rx="10" fill="#77767b"/>
  <rect x="20" y="16" width="88" height="88" rx="10" fill="#9a9996"/>
  <rect x="22" y="20" width="2" height="80" fill="#ffffff" opacity="0.187"/>
  <g fill="#deddda">
    <rect x="26" y="22" width="24" height="24" rx="5"/>
    <rect x="52" y="22" width="24" height="24" rx="5"/>
    <rect x="26" y="48" width="24" height="24" rx="5"/>
    <rect x="78" y="48" width="24" height="24" rx="5"/>
    <rect x="52" y="74" width="24" height="24" rx="5"/>
    <rect x="78" y="74" width="24" height="24" rx="5"/>
  </g>
  <g fill="#3584e4">
    <rect x="35" y="27" width="4" height="14" rx="2"/>
    <rect x="31" y="37" width="12" height="4" rx="2"/>
    <rect x="33" y="29" width="6" height="4" rx="2"/>
  </g>
  <g fill="#2ec27e">
    <rect x="57" y="27" width="14" height="4" rx="2"/>
    <rect x="67" y="29" width="4" height="6" rx="2"/>
    <rect x="57" y="33" width="14" height="4" rx="2"/>
    <rect x="57" y="35" width="4" height="6" rx="2"/>
    <rect x="57" y="37" width="14" height="4" rx="2"/>
  </g>
  <g stroke="#241f31" stroke-width="4" stroke-linecap="round">
    <path d="M90 54 V66 M84 60 H96 M86 56 L94 64 M94 56 L86 64"/>
  </g>
  <circle cx="90" cy="60" r="6" fill="#241f31"/>
  <g>
    <rect x="61" y="79" width="3" height="15" rx="1.5" fill="#241f31"/>
    <rect x="57" y="92" width="12" height="3" rx="1.5" fill="#241f31"/>
    <path d="M64 79 L73 82 L64 85 Z" fill="#e01b24"/>
  </g>
</svg>
