<?xml version="1.0" encoding="UTF-8"?>
<!-- The app is a list of coins with a star beside the ones you keep, so the
     icon is a coin with the star on it. Round, which nothing else in this set
     is: Habits is a grid, Vitals is four bars, Keep is a sheet, and at 42px in
     the drawer the silhouette is the whole of what tells them apart.

     Drawn as an Adwaita object rather than a full bleed tile, which is the
     house pattern here and the reason is in apps/keep/data/org.moarchy.Keep.svg
     at length: the drawer paints the .desktop icon bare, four to a row beside
     Contacts and Calculator, so an icon that fills its own square reads as a
     tile rather than as a thing. The same 88x88 face at x 20..108, y 16..104 on
     two 2px lips a step darker down the Adwaita slate ramp, with the 2px white
     specular at 0.187 every icon in this set carries.

     The coin is the theme yellow the app draws a lit star in, and the star is
     cut out of it in the bottom of the slate ramp rather than laid on top in a
     second colour: two golds and a white star was three colours doing one job.

     No clip path anywhere. The drawer renders with QtSvg, which ignores
     clipping and paints the clip shape instead, so a rounded corner is an rx on
     the rect that needs it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect x="20" y="24" width="88" height="88" rx="10" fill="#3d3846"/>
  <rect x="20" y="20" width="88" height="88" rx="10" fill="#5e5c64"/>
  <rect x="20" y="16" width="88" height="88" rx="10" fill="#77767b"/>
  <rect x="22" y="20" width="2" height="80" fill="#ffffff" opacity="0.187"/>
  <circle cx="64" cy="60" r="32" fill="#f5c211"/>
  <circle cx="64" cy="60" r="26.5" fill="none" stroke="#e5a50a" stroke-width="3"/>
  <polygon points="64.0,42.0 68.3,54.0 81.1,54.4 71.0,62.3 74.6,74.6 64.0,67.4 53.4,74.6 57.0,62.3 46.9,54.4 59.7,54.0" fill="#3d3846"/>
</svg>
