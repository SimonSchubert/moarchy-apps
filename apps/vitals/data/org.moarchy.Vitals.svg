<?xml version="1.0" encoding="UTF-8"?>
<!-- The app is four measurements drawn as bars, so the icon is four bars: the
     tracks behind them are the ones in the app, and the fills are the app's own
     hues in the app's own order.

     Drawn as an Adwaita object and not as a full-bleed tile, which is what this
     was: a 128x128 rounded square of #2b3340, edge to edge. The drawer paints
     the .desktop icon bare, four to a row beside Contacts and Calculator
     (apps/keep/data/org.moarchy.Keep.svg records the whole argument), so an
     icon that fills its own square reads as a tile rather than as a thing,
     and at #2b3340 it averaged 74 where the other eleven icons here sit between
     121 and 230, which on a light theme's sheet is a black square and on a dark
     one is a plate that vanishes and leaves four bars floating.

     So: the same 88x88 face at x 20..108, y 16..104 on two 2px lips a step
     darker down the Adwaita slate ramp (#77767b, #5e5c64, #3d3846), with the
     2px white specular at 0.187 every icon in this set carries. Four 14px
     tracks on 6px gaps, centred with 7px to spare either side, in the bottom of
     that ramp so an empty track reads as a well in the face.

     No clip path anywhere. The drawer renders with QtSvg, which ignores
     clipping and paints the clip shape instead, so a rounded corner is an rx on
     the rect that needs it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect x="20" y="24" width="88" height="88" rx="10" fill="#3d3846"/>
  <rect x="20" y="20" width="88" height="88" rx="10" fill="#5e5c64"/>
  <rect x="20" y="16" width="88" height="88" rx="10" fill="#77767b"/>
  <rect x="22" y="20" width="2" height="80" fill="#ffffff" opacity="0.187"/>
  <g fill="#3d3846">
    <rect x="27" y="26" width="14" height="68" rx="7"/>
    <rect x="47" y="26" width="14" height="68" rx="7"/>
    <rect x="67" y="26" width="14" height="68" rx="7"/>
    <rect x="87" y="26" width="14" height="68" rx="7"/>
  </g>
  <rect x="27" y="40" width="14" height="54" rx="7" fill="#3584e4"/>
  <rect x="47" y="60" width="14" height="34" rx="7" fill="#33d17a"/>
  <rect x="67" y="30" width="14" height="64" rx="7" fill="#00b8c4"/>
  <rect x="87" y="70" width="14" height="24" rx="7" fill="#f5c211"/>
</svg>
