<?xml version="1.0" encoding="UTF-8"?>
<!-- The app is a grid of days that fill in as they are kept, so the icon is
     that grid with a streak running through it. Three columns because the row
     on a phone is five and three reads more clearly at 42px.

     Drawn as an Adwaita object and not as a full-bleed tile, which is what this
     was: a 128x128 rounded square of #2b3340, edge to edge. Two things were
     wrong with that and only one of them is the colour. The drawer paints the
     .desktop icon bare, with no tile behind it, four to a row beside Contacts
     and Calculator (apps/keep/data/org.moarchy.Keep.svg records the whole
     argument), so an icon that fills its own square is the one thing in that
     grid reading as a tile rather than as a thing. And at #2b3340 it averaged
     61 where the other eleven icons here sit between 121 and 230: on a light
     theme's sheet that is a hole punched in the grid, and on a dark one the
     plate disappears into the sheet and the day squares float.

     So: the same 88x88 face at x 20..108, y 16..104 on two 2px lips a step
     darker down the Adwaita slate ramp (#77767b, #5e5c64, #3d3846), with the
     2px white specular at 0.187 every icon in this set carries. The days keep
     the app's own two states, and the empty ones are the bottom of that ramp
     so they read as wells in the face rather than as more squares on it.

     No clip path anywhere: QtSvg ignores clip-path and paints an out-of-defs
     clipPath as a black rectangle. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect x="20" y="24" width="88" height="88" rx="10" fill="#3d3846"/>
  <rect x="20" y="20" width="88" height="88" rx="10" fill="#5e5c64"/>
  <rect x="20" y="16" width="88" height="88" rx="10" fill="#77767b"/>
  <rect x="22" y="20" width="2" height="80" fill="#ffffff" opacity="0.187"/>
  <g fill="#3d3846">
    <rect x="28" y="24" width="20" height="20" rx="6"/>
    <rect x="54" y="24" width="20" height="20" rx="6"/>
    <rect x="80" y="24" width="20" height="20" rx="6"/>
    <rect x="28" y="50" width="20" height="20" rx="6"/>
    <rect x="80" y="50" width="20" height="20" rx="6"/>
    <rect x="28" y="76" width="20" height="20" rx="6"/>
    <rect x="54" y="76" width="20" height="20" rx="6"/>
  </g>
  <g fill="#33d17a">
    <rect x="54" y="50" width="20" height="20" rx="6"/>
    <rect x="80" y="76" width="20" height="20" rx="6"/>
  </g>
</svg>
