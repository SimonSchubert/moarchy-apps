  <path d="M64 16h34a8 8 0 0 1 8 8v88a8 8 0 0 1-8 8H64z" fill="#f6f5f4"/>
  <path d="M30 16h68a8 8 0 0 1 8 8v14H22V24a8 8 0 0 1 8-8z" fill="#2ec27e"/>
  <path d="M64 16h34a8 8 0 0 1 8 8v14H64z" fill="#57e389"/>
  <g fill="#241f31">
    <rect x="34" y="52" width="7" height="44" rx="2"/>
    <rect x="46" y="52" width="4" height="44" rx="2"/>
    <rect x="55" y="52" width="9" height="44" rx="2"/>
