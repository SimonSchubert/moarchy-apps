<?xml version="1.0" encoding="UTF-8"?>
<!-- A packet with a barcode on it.

     A bare barcode was the first attempt and it disappeared: dark bars on a
     dark drawer are dark bars on nothing. A packet is an object in the way
     Portfolio's briefcase and Foliate's book are, and it is also where a
     barcode actually lives, so the code gets something to sit on without the
     icon becoming a tile with a picture in it. -->
