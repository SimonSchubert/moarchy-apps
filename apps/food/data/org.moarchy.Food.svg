<?xml version="1.0" encoding="UTF-8"?>
<!-- A carton with a barcode on the front. Green because that is Nutri-Score
     A, which is the colour a person in an aisle is hoping for.

     Drawn as an Adwaita object rather than a full bleed tile, which is the
     house pattern here and the reason is in apps/keep/data/org.moarchy.Keep.svg
     at length: the drawer paints the .desktop icon bare, four to a row beside
     Contacts and Calculator, so an icon that fills its own square reads as a
     tile rather than as a thing. The same 88x88 face at x 20..108, y 16..104
     on two 2px lips a step darker down the Adwaita green ramp, with the 2px
     white specular at 0.187 every icon in this set carries.

     The bars are 3px, which is a pixel at the 42px the drawer actually asks
     for. No clip path anywhere. The drawer renders with QtSvg, which ignores
     clipping and paints the clip shape instead. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect x="20" y="24" width="88" height="88" rx="10" fill="#26a269"/>
  <rect x="20" y="20" width="88" height="88" rx="10" fill="#2ec27e"/>
  <rect x="20" y="16" width="88" height="88" rx="10" fill="#57e389"/>
  <rect x="22" y="20" width="2" height="80" fill="#ffffff" opacity="0.187"/>
  <rect x="32" y="28" width="64" height="16" rx="4" fill="#26a269"/>
  <g fill="#3d3846">
    <rect x="34" y="52" width="4" height="40"/>
    <rect x="42" y="52" width="3" height="40"/>
    <rect x="48" y="52" width="6" height="40"/>
    <rect x="57" y="52" width="3" height="40"/>
    <rect x="63" y="52" width="5" height="40"/>
    <rect x="71" y="52" width="3" height="40"/>
    <rect x="77" y="52" width="7" height="40"/>
    <rect x="87" y="52" width="3" height="40"/>
    <rect x="93" y="52" width="4" height="40"/>
  </g>
</svg>
