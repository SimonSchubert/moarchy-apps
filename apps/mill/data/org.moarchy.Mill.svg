<?xml version="1.0" encoding="UTF-8"?>
<!-- Two squares, the spokes between them, and four men — the Morris board as a
     diagram rather than as a wooden tile.

     Three squares is what the real board has and what the first cut drew, and
     at 42px in the drawer the inner two merged into a filled blob. Two squares
     and thicker lines is still unmistakably this game and is still legible at
     the size it is actually used. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">

  <g fill="none" stroke="#b5835a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <rect x="24" y="24" width="80" height="80" rx="4"/>
    <rect x="48" y="48" width="32" height="32" rx="4"/>
    <path d="M64 24v24M64 80v24M24 64h24M80 64h24"/>
  </g>
  <circle cx="24" cy="24" r="13" fill="#241f31"/>
  <circle cx="104" cy="24" r="13" fill="#f6f5f4"/>
  <circle cx="24" cy="104" r="13" fill="#f6f5f4"/>
  <circle cx="104" cy="104" r="13" fill="#241f31"/>
</svg>
