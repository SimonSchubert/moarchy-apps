<!-- A shelf of videos: three screens stood one behind another, the front one
     with a play mark on it.

     Drawn as the object rather than as a button, as the other icons here are:
     the drawer is a grid of things — a handset, a rocket, a book — so a row of
     screens belongs there and a coloured square with a triangle does not. -->
