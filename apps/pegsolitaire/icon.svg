<?xml version="1.0" encoding="UTF-8"?>
<!-- The cross-shaped board, with pegs around one empty middle.

     The cross is the silhouette — nothing else in this set or in the drawer is
     that shape — so the board earns its place as an outline rather than as a
     square with a board painted on it.

     Eight pegs rather than the thirty-two a real board has, ringing the one
     hole they are played into — symmetric, because a scattered few read as
     pieces knocked over rather than as a puzzle set up. At 42px a full board is a texture; eight circles and
     a gap is a puzzle with one move left in it, which is the picture worth
     drawing. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">

  <path d="M44 12h40v32h32v40H84v32H44V84H12V44h32z" fill="#986a44"/>
  <path d="M64 12h20v32h32v40H84v32H64z" fill="#7a5436"/>
  <g fill="#3584e4">
    <circle cx="64" cy="28" r="11"/><circle cx="64" cy="100" r="11"/>
    <circle cx="28" cy="64" r="11"/><circle cx="100" cy="64" r="11"/>
    <circle cx="46" cy="46" r="11"/><circle cx="82" cy="46" r="11"/>
    <circle cx="46" cy="82" r="11"/><circle cx="82" cy="82" r="11"/>
  </g>
  <circle cx="64" cy="64" r="11" fill="#5a3d28"/>
</svg>
