<?xml version="1.0" encoding="UTF-8"?>
<!-- Drawn as an Adwaita object rather than a full-bleed tile, for the reason
     Keep's icon records: mobileomarchy's AppDrawer.qml paints the .desktop icon
     bare, with no tile behind it, four to a row next to Contacts and
     Calculator. An icon that fills its own square is the one thing in that grid
     that reads as a tile instead of as a thing.

     So this is the board: a wooden cross at x 16..112, y 16..112, sitting on
     two 2px lips a step darker down the brown ramp (#b5835a, #986a44, #7a5436)
     the way Contacts steps its blues, with the same 2px white specular at 0.187
     inset from the left edge.

     Five holes across and not seven. A 7x7 board at the 42px the drawer
     actually asks for puts a hole every six pixels, which is a texture rather
     than a board. Five keeps the cross unmistakable and leaves the pegs big
     enough to be pegs, and the one empty hole in the middle is the thing that
     says which game this is.

     Nothing here is finer than 4px at 128, which is better than a pixel at 42.
     No clip path: QtSvg ignores clip-path and paints an out-of-defs clipPath as
     a black rectangle, which is how Chess's first icon drew as a black square. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <g fill="#7a5436">
    <rect x="41" y="28" width="46" height="88" rx="14"/>
    <rect x="20" y="49" width="88" height="46" rx="14"/>
  </g>
  <g fill="#986a44">
    <rect x="41" y="24" width="46" height="88" rx="14"/>
    <rect x="20" y="45" width="88" height="46" rx="14"/>
  </g>
  <g fill="#b5835a">
    <rect x="41" y="20" width="46" height="88" rx="14"/>
    <rect x="20" y="41" width="88" height="46" rx="14"/>
  </g>
  <rect x="22" y="45" width="2" height="38" fill="#ffffff" opacity="0.187"/>
  <g fill="#6b4a30">
    <circle cx="64" cy="64" r="9"/>
  </g>
  <g fill="#3584e4" stroke="#1c5fad" stroke-width="2">
    <circle cx="64" cy="34" r="9"/>
    <circle cx="64" cy="94" r="9"/>
    <circle cx="34" cy="64" r="9"/>
    <circle cx="94" cy="64" r="9"/>
    <circle cx="49" cy="49" r="9"/>
    <circle cx="79" cy="49" r="9"/>
    <circle cx="49" cy="79" r="9"/>
    <circle cx="79" cy="79" r="9"/>
  </g>
</svg>
