<!--l version="1.0" encoding="UTF-8"?>
<!— Drawn as an Adwaita object rather than a full-bleed tile, for the reason
     Keep's icon records and Reversi's repeats: mobileomarchy's AppDrawer.qml
     paints the .desktop icon bare, with no tile behind it, four to a row next
     to Contacts and Calculator. An icon that fills its own square is the one
     thing in that grid that reads as a tile instead of as a thing.

     So this is a board: an 88x88 face at x 20..108, y 16..104, sitting on two
     2px lips a step darker down a brown ramp (#c9a279, #a87f53, #7f5c39) the
     way Contacts steps its blues, and the same 2px white specular at 0.187
     inset from the left edge.

     Four squares across, not eight. Eight of 11px is mush at the 42px the
     drawer actually asks for, and the checker is only there to say "board" —
     what says "chess" is the knight, which is the one piece nobody mistakes
     for a draughtsman. It is the same Font Awesome outline the app draws on
     its own board, at the same proportions, with a 4px light rim so that it
     separates over a light square and a dark one alike. Nothing here is finer
     than 2px at 128, which is half a pixel at 42. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect x="20" y="24" width="88" height="88" rx="10" fill="#7f5c39"/>
  <rect x="20" y="20" width="88" height="88" rx="10" fill="#a87f53"/>
  <rect x="20" y="16" width="88" height="88" rx="10" fill="#c9a279"/>
  <g fill="#8f6941" clip-path="url(#face)">
    <rect x="42" y="16" width="22" height="22"/>
    <rect x="86" y="16" width="22" height="22"/>
    <rect x="20" y="38" width="22" height="22"/>
    <rect x="64" y="38" width="22" height="22"/>
    <rect x="42" y="60" width="22" height="22"/>
    <rect x="86" y="60" width="22" height="22"/>
    <rect x="20" y="82" width="22" height="22"/>
    <rect x="64" y="82" width="22" height="22"/>
  </g>
  <clipPath id="face"><rect x="20" y="16" width="88" height="88" rx="10"/></clipPath>
  <rect x="22" y="20" width="2" height="80" fill="#ffffff" opacity="0.187"/>
