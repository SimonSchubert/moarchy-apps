<?xml version="1.0" encoding="UTF-8"?>
<!-- Three tiles in the three states a guess comes back in: right, nearly, and
     not in the word.

     One row rather than two. Six small tiles read as a colour palette at 42px;
     three big ones read as a word being guessed, which is the app.

     Each tile carries a mark as well as a colour — a tick, a ring, a bar — for
     the same reason the app does: roughly one man in twelve cannot tell the
     green from the yellow, and the colour alone would be the whole answer. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">

  <rect x="6" y="40" width="36" height="48" rx="7" fill="#26a269"/>
  <rect x="46" y="40" width="36" height="48" rx="7" fill="#e5a50a"/>
  <rect x="86" y="40" width="36" height="48" rx="7" fill="#77767b"/>
  <path d="M15 64l6 7 12-14" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="64" cy="64" r="10" fill="none" stroke="#ffffff" stroke-width="6"/>
  <rect x="94" y="61" width="20" height="6" rx="3" fill="#ffffff" opacity="0.85"/>
</svg>
