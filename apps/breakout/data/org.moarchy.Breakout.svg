<?xml version="1.0" encoding="UTF-8"?>
<!-- Drawn as an Adwaita object rather than a full-bleed tile, for the reason
     Keep's icon records: mobileomarchy's AppDrawer.qml paints the .desktop icon
     bare, with no tile behind it, four to a row next to Contacts and
     Calculator. An icon that fills its own square is the one thing in that grid
     that reads as a tile instead of as a thing.

     So this is the field: an 88x88 face at x 20..108, y 16..104 on two 2px lips
     a step darker down a slate ramp (#3d3846, #2d2733, #241f31), with the same
     2px white specular at 0.187 inset from the left edge.

     Three rows of three bricks, not eight of seven. At the 42px the drawer
     actually asks for, a 56-brick wall is a texture; three rows in three of the
     app's own row colours are unmistakably a Breakout wall, and leave the ball
     and the bat big enough to be a ball and a bat.

     Nothing here is finer than 4px at 128, which is better than a pixel at 42.
     No clip path: QtSvg ignores clip-path and paints an out-of-defs clipPath as
     a black rectangle, which is how Chess's first icon drew as a black square. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect x="20" y="24" width="88" height="88" rx="10" fill="#241f31"/>
  <rect x="20" y="20" width="88" height="88" rx="10" fill="#2d2733"/>
  <rect x="20" y="16" width="88" height="88" rx="10" fill="#3d3846"/>
  <rect x="22" y="20" width="2" height="80" fill="#ffffff" opacity="0.187"/>
  <g>
    <rect x="26" y="26" width="24" height="10" rx="3" fill="#e01b24"/>
    <rect x="52" y="26" width="24" height="10" rx="3" fill="#e01b24"/>
    <rect x="78" y="26" width="24" height="10" rx="3" fill="#e01b24"/>
    <rect x="26" y="40" width="24" height="10" rx="3" fill="#ff7800"/>
    <rect x="52" y="40" width="24" height="10" rx="3" fill="#ff7800"/>
    <rect x="78" y="40" width="24" height="10" rx="3" fill="#ff7800"/>
    <rect x="26" y="54" width="24" height="10" rx="3" fill="#f5c211"/>
    <rect x="78" y="54" width="24" height="10" rx="3" fill="#f5c211"/>
  </g>
  <circle cx="64" cy="74" r="7" fill="#f6f5f4"/>
  <rect x="46" y="90" width="36" height="9" rx="4.5" fill="#3584e4"/>
</svg>
